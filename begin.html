<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SignBridge</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body {
      margin: 0;
      background: #f4f5ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .phone {
      width: 360px;
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    .header {
      background: linear-gradient(135deg, #2d3fa3, #4a63e7);
      color: white;
      padding: 32px 20px 48px;
      position: relative;
      text-align: center;
    }
    .logo {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .header h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 600;
    }
    .wave {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
    }
    .content {
      padding: 24px 20px 32px;
    }
    .title {
      text-align: center;
      color: #8b5cf6;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      font-size: 14px;
      color: #555;
      display: block;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 14px;
      outline: none;
    }
    select:focus {
      border-color: #8b5cf6;
    }
    .btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #a78bfa;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      background: #8b5cf6;
    }
  </style>
</head>
<body>
    <div class="phone">
        <div class="header">
        <div class="logo">✋</div>
        <h1>SignBridge</h1>
        <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none">
        <path fill="#ffffff" d="M0,64 C120,96 240,96 360,80 480,64 600,32 720,32 840,32 960,64 1080,64 1200,64 1320,32 1440,16 L1440,120 L0,120 Z"></path>
        </svg>
    </div>

    <div class="content">
        <div class="title">Lựa chọn</div>

        <div class="field">
        <label>Lĩnh vực</label>
            <select>
                <option>Pháp luật</option>
                <option>Y tế</option>
                <option>Thêm</option>
            </select>
        </div>

        <div class="field">
        <label>Khu vực</label>
            <select>
            <option>Hà Nội</option>
            <option>Hải Phòng</option>
            <option>Thành phố Hồ Chí Minh</option>
            <option>Thêm</option>
        </select>
        </div>
        <div class="field">
        <label>Chế độ </label>
            <select>
                <option>Camera</option>
                <option>Màn hình</option>
            </select>
        </div>
            
            <a href="http://localhost:3000">
            <button class="btn">Tiếp tục</button>
            </a>

    </div>
  </div>
</body>
</html>
