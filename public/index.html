<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wildlife Videos</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 1100px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p.subtitle {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }

    .upload-btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      border-radius: 8px;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    #status {
      margin-top: 15px;
      font-size: 16px;
    }

    /* 🔥 Video + Text layout */
    .content {
      display: flex;
      gap: 20px;
      margin-top: 30px;
      align-items: flex-start;
    }

    video {
      width: 600px;
      max-width: 100%;
      border-radius: 10px;
      display: none;
    }

    .text-box {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 10px;
      min-height: 200px;
      white-space: pre-line;
      display: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Wildlife Videos</h1>
    <p class="subtitle">Upload your wildlife videos here!</p>

    <label class="upload-btn">
      Upload Video
      <input type="file" id="videoInput" accept="video/*">
    </label>

    <p id="status"></p>

    <div class="content">
      <video id="videoPlayer" controls></video>
      <div class="text-box" id="serverText"></div>
    </div>
  </div>

<script>
  const input = document.getElementById("videoInput");
  const status = document.getElementById("status");
  const videoPlayer = document.getElementById("videoPlayer");
  const serverTextBox = document.getElementById("serverText");

  let timeline = [];

  input.addEventListener("change", async () => {
    const file = input.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append("video", file);

    status.textContent = "Uploading...";

    try {
      const res = await fetch("/upload", {
        method: "POST",
        body: formData,
      });

      const data = await res.json();

      status.textContent = "Upload successful!";
      timeline = data.timeline;

      // 🎬 Play video
      videoPlayer.src = `/videos/${data.filename}`;
      videoPlayer.style.display = "block";
      videoPlayer.play();

      // 📝 Show text box
      serverTextBox.style.display = "block";
      serverTextBox.textContent = "";

    } catch (err) {
      status.textContent = "Upload failed!";
    }
  });

  // ⏱️ Sync text with video time
  videoPlayer.addEventListener("timeupdate", () => {
    const currentTime = videoPlayer.currentTime;
    serverTextBox.textContent=" "
    for (let i = 0; i <timeline.length ; i++) {
      if (currentTime >= timeline[i].time) {
        serverTextBox.textContent+=" ";
        serverTextBox.textContent += timeline[i].text;
      }
    }
  });
</script>


</body>
</html>
