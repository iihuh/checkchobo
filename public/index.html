<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Bridge - Subtitle Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="appContainer">
    <header>
        <div class="logo">Sign Bridge</div>
        <div class="header-actions">
            <button class="btn exit-btn" onclick="toggleFullscreen()">Exit Fullscreen</button>
            <span id="status">READY</span>
        </div>
    </header>

    <main class="main-content">
        <section class="video-section">
            <div id="normalControls" class="controls-bar">
                <label class="btn upload-label">
                    Select Video 
                    <input type="file" id="videoInput" accept="video/*">
                </label>
                <button class="btn" id="goFsBtn" onclick="toggleFullscreen()">Go Fullscreen</button>
            </div>

            <div class="video-wrapper">
                <video id="videoPlayer" controls></video>
                <div id="subtitleOverlay">
                    <div class="subtitle-text" id="activeSubtitle"></div>
                </div>
            </div>
        </section>

        <aside class="chat-section">
            <div class="feed-header">Subtitle Feed</div>
            <div id="chatBox" class="subtitle-history"></div>
        </aside>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
